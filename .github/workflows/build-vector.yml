name: Build Vector Database

on:
  push:
    paths:
      - 'knowledge/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      - run: pip install unstructured

      - name: Debug Token
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ GITHUB_TOKEN is EMPTY"
            exit 1
          else
            echo "✅ GITHUB_TOKEN is set, length=${#GITHUB_TOKEN}"
          fi

      - name: Confirm correct script exists        # ← catches the "wrong file" bug
        run: |
          echo "=== Scripts found ==="
          find . -name "embedding_builder*.py"
          echo "=== Running file ==="
          cat sync/embedding_builder_github.py | head -20

      - name: Build Embeddings
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python sync/embedding_builder_github.py

      - name: Commit Vector DB
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add vectordb/
          git commit -m "Update vector database" || echo "No changes"
          git push
