name: Publish ServiceNow Copilot Agent

on:

  push:
    branches:
      - main

    paths:
      - '.github-copilot/**'
      - 'knowledge/**'
      - 'vectordb/**'

  workflow_dispatch:

jobs:

  validate-and-publish:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Agent File
        run: |

          echo "Validating GitHub Copilot agent"

          test -f .github-copilot/agents/servicenow-copilot.agent.md

          echo "Agent file exists"

      - name: Validate Prompt Files
        run: |

          echo "Checking prompts"

          ls -la .github-copilot/prompts/

      - name: Validate Knowledge Directory
        run: |

          echo "Checking knowledge directory"

          ls -la knowledge/

      - name: Validate Vector Database
        run: |

          echo "Checking vector database"

          ls -la vectordb/

      - name: Generate Build Metadata
        run: |

          mkdir -p build

          echo "Build Time: $(date)" > build/build-info.txt
          echo "Commit: $GITHUB_SHA" >> build/build-info.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4

        with:
          name: servicenow-copilot-agent
          path: |
            .github-copilot/
            knowledge/
            vectordb/
            build/

      - name: Commit Build Metadata
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add build/

          git commit -m "Update agent build metadata" || echo "No changes"

          git push

      - name: Publish Status
        run: |

          echo "===================================="
          echo "ServiceNow Copilot Agent Published"
          echo "===================================="

          echo "Agent Name: ServiceNow Copilot"
          echo "Knowledge Sync: Enabled"
          echo "Internet Fallback: Enabled"
          echo "Vector DB: Updated"
          echo "Enterprise DevOps Mode: Enabled"